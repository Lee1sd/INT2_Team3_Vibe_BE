# Career Dungeon 백엔드의 공통 애플리케이션 설정을 관리한다.
spring:
  application:
    name: career-dungeon
  profiles:
    default: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

auth:
  cookie:
    # refreshToken 쿠키 Secure/SameSite 기본값 — local·test 프로필 기준. FE(3000)/BE(8080)가
    # 둘 다 HTTP localhost라 Secure 쿠키는 저장되지 않으므로 SameSite=Lax + Secure=false를
    # 쓴다. prod는 application-prod.yml에서 Secure=true + SameSite=None으로 덮어쓴다(이슈 #117).
    secure: false
    same-site: Lax

aws:
  # AWS SDK 기본 자격증명 체인(환경변수/프로파일/IAM Role)을 사용하며 키를 YAML에 저장하지 않는다.
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    # profile별 설정이 없을 때도 공통 프로퍼티 키를 유지한다. 실제 버킷은 환경변수로 주입한다.
    bucket: ${AWS_S3_BUCKET:}

resume:
  s3:
    presigned-upload-expiration-seconds: ${RESUME_S3_PRESIGNED_UPLOAD_EXPIRATION_SECONDS:300}

llm:
  mode: mock
  model: claude-haiku-4-5
  anthropic:
    base-url: https://api.anthropic.com
    version: 2023-06-01
    max-tokens: 2048
    connect-timeout: 5s
    read-timeout: 30s
