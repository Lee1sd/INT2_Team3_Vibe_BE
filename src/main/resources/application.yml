# Career Dungeon 백엔드의 공통 애플리케이션 설정을 관리한다.
spring:
  application:
    name: career-dungeon
  profiles:
    default: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

llm:
  mode: mock
  model: claude-haiku-4-5
  anthropic:
    base-url: https://api.anthropic.com
    version: 2023-06-01
    max-tokens: 2048
    connect-timeout: 5s
    read-timeout: 30s
