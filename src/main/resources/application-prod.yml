llm:
  mode: ${LLM_MODE:mock}
  model: ${LLM_MODEL:claude-haiku-4-5}
  anthropic:
    base-url: ${LLM_ANTHROPIC_BASE_URL:https://api.anthropic.com}
    version: ${LLM_ANTHROPIC_VERSION:2023-06-01}
    max-tokens: ${LLM_ANTHROPIC_MAX_TOKENS:2048}
    connect-timeout: ${LLM_ANTHROPIC_CONNECT_TIMEOUT:5s}
    read-timeout: ${LLM_ANTHROPIC_READ_TIMEOUT:30s}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: '{baseUrl}/api/auth/oauth2/callback/{registrationId}'
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
