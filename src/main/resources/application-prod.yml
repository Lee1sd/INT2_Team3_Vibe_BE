llm:
  mode: ${LLM_MODE:mock}
  model: ${LLM_MODEL:claude-haiku-4-5}
  anthropic:
    base-url: ${LLM_ANTHROPIC_BASE_URL:https://api.anthropic.com}
    version: ${LLM_ANTHROPIC_VERSION:2023-06-01}
    max-tokens: ${LLM_ANTHROPIC_MAX_TOKENS:2048}
    connect-timeout: ${LLM_ANTHROPIC_CONNECT_TIMEOUT:5s}
    read-timeout: ${LLM_ANTHROPIC_READ_TIMEOUT:30s}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: '{baseUrl}/api/auth/oauth2/callback/{registrationId}'
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

auth:
  cookie:
    # 배포 환경은 FE/BE가 서로 다른 도메인(cross-site)이고 HTTPS이므로, cross-site 쿠키
    # 관례대로 Secure=true + SameSite=None을 쓴다(이슈 #117). SameSite=None은 반드시
    # Secure=true와 함께 있어야 브라우저가 쿠키를 받아들인다.
    secure: true
    same-site: None

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}

badge:
  images:
    # 운영 환경에서만 private S3 Presigned GET URL을 응답한다(ADR-022).
    use-s3: true
