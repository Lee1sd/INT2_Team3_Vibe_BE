# 외부 MySQL 없이도 기본 테스트를 실행할 수 있도록 H2를 MySQL 호환 모드로 설정한다.
spring:
  datasource:
    url: jdbc:h2:mem:career_dungeon;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 'test-client-id'
            client-secret: 'test-client-secret'
            redirect-uri: 'http://localhost/api/auth/oauth2/callback/{registrationId}'
            scope:
              - email
              - profile

jwt:
  secret: 'dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdW5pdC10ZXN0cy1vbmx5LW5vdC1wcm9k'

aws:
  s3:
    bucket: 'test-bucket'
    # S3Client/S3Presigner 빈은 생성 시점에 네트워크 호출을 하지 않으므로 실제 자격증명
    # 없이도 컨텍스트가 뜬다. 실제 PutObject/presign 호출이 필요한 테스트는 S3Client를
    # Mockito로 모킹한다(ADR-018).
