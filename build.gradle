// Java 17 기반 Spring Boot 애플리케이션의 빌드, 의존성, 테스트 규칙을 관리한다.
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.careerdungeon'
version = '0.0.1-SNAPSHOT'

ext {
    set('awsSdkVersion', '2.47.1')
    set('jjwtVersion', '0.13.0')
    set('pdfboxVersion', '3.0.7')
    set('springRetryVersion', '2.0.13')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
    }
}

dependencies {
    // REST API 및 입력값 검증
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // MySQL 영속성과 트랜잭션
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // DB 스키마 버전 관리 (src/main/resources/db/migration/V*.sql)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // Google OAuth2와 JWT 기반 인증·인가
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 이력서 PDF 추출과 AWS S3 파일 저장. software.amazon.awssdk:s3에 S3Presigner가
    // 이미 포함되어 있어(2.47.1 기준) 별도 s3-presigner 아티팩트가 필요 없다
    // (프로필 이미지 Presigned GET URL 발급, ADR-018).
    implementation "org.apache.pdfbox:pdfbox:${pdfboxVersion}"
    implementation 'software.amazon.awssdk:s3'

    // LLM 및 외부 API 일시 오류에 대한 재시도
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation "org.springframework.retry:spring-retry:${springRetryVersion}"

    // 기본 테스트와 MySQL 통합 테스트 지원
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'runS3SmokeTest', System.getProperty('runS3SmokeTest', 'false')
    // 로컬 실제 MySQL이 있을 때만 도는 resumes.extracted_text 컬럼 길이 제약 재현 테스트.
    systemProperty 'runResumeTextColumnSizeTest', System.getProperty('runResumeTextColumnSizeTest', 'false')
    // 로컬 실제 MySQL이 있을 때만 도는 V29/V30 실제 컬럼 타입(SHOW COLUMNS) 검증 테스트(이슈 #196).
    systemProperty 'runMigrationColumnTypeVerificationTest', System.getProperty('runMigrationColumnTypeVerificationTest', 'false')
    // 비용이 발생하는 Claude 실호출 테스트는 명시적 시스템 프로퍼티가 있을 때만 전달한다.
    systemProperty 'runClaudeCareerReportTest', System.getProperty('runClaudeCareerReportTest', 'false')
    systemProperty 'careerReportSampleCount', System.getProperty('careerReportSampleCount', '10')
    systemProperty 'runClaudeInitialFollowUpTest', System.getProperty('runClaudeInitialFollowUpTest', 'false')
    systemProperty 'runClaudeLv2BalanceTest', System.getProperty('runClaudeLv2BalanceTest', 'false')
    systemProperty 'lv2BalancePromptVariant', System.getProperty('lv2BalancePromptVariant', 'current')
    systemProperty 'lv2BalanceSampleCount', System.getProperty('lv2BalanceSampleCount', '10')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
