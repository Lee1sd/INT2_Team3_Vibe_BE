# Java 17과 저장소의 Gradle Wrapper로 빌드, 테스트, 패키징을 검증한다.
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gradle-check:
    name: Java 17 / Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run checks and build executable JAR
        run: ./gradlew check bootJar --no-daemon --stacktrace

      - name: Upload Gradle test and quality reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/reports/**
            **/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 7
